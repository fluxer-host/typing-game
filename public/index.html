<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typing race</title>
  <meta name="description" content="Race other Fluxer users on the same sentence. Desktop, mobile, and mouse-only cursor ladders.">
  <link rel="canonical" href="https://typing.fluxer.my/">
  <meta name="theme-color" content="#0e0e12">
  <meta property="og:title" content="Typing race">
  <meta property="og:description" content="Race other Fluxer users on the same sentence. Desktop, mobile, and mouse-only cursor ladders.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://typing.fluxer.my/">
  <meta property="og:image" content="https://typing.fluxer.my/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Purple rounded square with a white wave and a white caret, the Typing race mark.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Typing race">
  <meta name="twitter:description" content="Race other Fluxer users on the same sentence. Desktop, mobile, and mouse-only cursor ladders.">
  <meta name="twitter:image" content="https://typing.fluxer.my/og.png">
  <meta name="twitter:image:alt" content="Purple rounded square with a white wave and a white caret, the Typing race mark.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1 class="visually-hidden">Typing race</h1>
      <a class="brand" href="/">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#4641D9"/>
          <path d="M7 21c3-8 5-8 8 0s5 8 9 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <rect x="23" y="8" width="2" height="12" rx="1" fill="#fff"/>
        </svg>
        <span class="brand-name">Typing race</span>
      </a>
      <div id="account"></div>
    </header>
    <main class="layout">
      <section class="stage" id="stage">
        <p class="loading">Loading the track…</p>
      </section>
      <aside class="side">
        <section id="lanes"></section>
        <section id="you" class="panel panel-you"></section>
        <section id="board" class="panel panel-board"></section>
        <section id="recent" class="panel panel-recent"></section>
      </aside>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <div id="live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="noscript">This track needs JavaScript to race.</p></noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
